<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FruitVerse Snake</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    
    <!-- Styles -->
    <link rel="stylesheet" href="index.css">
</head>
<body>

    <div class="app-container">
        
        <!-- Splash Screen -->
        <div id="screen-splash" class="screen">
            <!-- Content injected by JS -->
        </div>

        <!-- Menu Screen -->
        <div id="screen-menu" class="screen">
            <!-- Content injected by JS -->
        </div>

        <!-- Game Screen -->
        <div id="screen-game" class="screen">
            <!-- Content injected by JS -->
        </div>

        <!-- Shop Screen -->
        <div id="screen-shop" class="screen">
            <!-- Content injected by JS -->
        </div>

        <!-- How To Play Screen -->
        <div id="screen-howToPlay" class="screen">
            <!-- Content injected by JS -->
        </div>

        <!-- Leaderboard Screen -->
        <div id="screen-leaderboard" class="screen">
            <!-- Content injected by JS -->
        </div>

        <!-- Missions Screen -->
        <div id="screen-missions" class="screen">
            <!-- Content injected by JS -->
        </div>

    </div>

    <!-- Firebase SDK (v8 compat for simpler vanilla JS usage) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <!-- Scripts (ES6 Modules) -->
    <script type="module" src="js/main.js"></script>
</body>
</html>
